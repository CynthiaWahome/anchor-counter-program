name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup component add rustfmt clippy

      - name: Install Solana CLI
        run: |
          set -euo pipefail
          for i in {1..3}; do
            if sh -c "$(curl -fsSL --retry 3 --retry-delay 5 https://release.solana.com/stable/install)"; then
              break
            fi
            sleep 5
          done
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          solana --version

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v1.2.1 anchor-cli --locked --force
          anchor --version

      - name: Format check (program)
        run: cargo fmt --check

      - name: Clippy (program)
        run: cargo clippy --all-targets -- -D warnings

      - name: Anchor tests
        run: anchor test

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Typecheck frontend
        working-directory: ./app
        run: npm ci && npm run typecheck
