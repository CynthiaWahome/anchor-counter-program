name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/solana-labs/solana:v2.1.0
      options: --entrypoint /bin/bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup component add rustfmt clippy

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v1.2.1 anchor-cli --locked --force
          anchor --version

      - name: Format check (program)
        run: cargo fmt --check

      - name: Clippy (program)
        run: cargo clippy --all-targets -- -D warnings

      - name: Anchor tests
        run: anchor test

      - name: Install Node.js
        run: |
          apt-get update -qq && apt-get install -y -qq ca-certificates curl gnupg
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y -qq nodejs

      - name: Typecheck frontend
        working-directory: ./app
        run: npm ci && npm run typecheck
